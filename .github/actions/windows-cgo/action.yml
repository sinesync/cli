name: Windows cgo toolchain
description: >
  Installs MSYS2 and exports the cgo environment the Windows build needs, so
  build.yml and release.yml compile the same binary.

runs:
  using: composite
  steps:
    - name: Install MSYS2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: MINGW64
        update: true
        # No mingw-w64-x86_64-sqlite3 on purpose: the Windows build compiles the
        # sqlite that go-sqlcipher vendors, via CGO_CFLAGS below, and links it
        # statically. Installing MSYS2's as well is what gave build.yml a
        # dynamically linked binary against a different sqlite from the one that
        # ships.
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

    - name: Export cgo environment
      shell: bash
      run: |
        set -euo pipefail

        # Resolved from the module graph, never written out. A hardcoded copy of
        # this path carrying the pinned pseudo-version is what broke v0.3.9:
        # go.mod's replace directive moved and the copy did not.
        #
        # .Dir returns a NATIVE path on Windows -- C:\Users\...\go\pkg\mod\... --
        # and backslashes reaching gcc through bash are escape sequences, not
        # separators. The first attempt at this action passed that straight into
        # -I and the include silently resolved to nothing. Converted here.
        SQLCIPHER_DIR="$(go list -m -f '{{.Dir}}' github.com/mutecomm/go-sqlcipher/v4)"
        SQLCIPHER_DIR="${SQLCIPHER_DIR//\\//}"
        if [ ! -f "${SQLCIPHER_DIR}/sqlite3.h" ]; then
          echo "::error::sqlite3.h not found under ${SQLCIPHER_DIR}"
          exit 1
        fi

        # $GITHUB_PATH is consumed by the runner, which resolves NATIVE Windows
        # paths. The first attempt wrote the MSYS form (/d/a/_temp/...), which is
        # valid inside bash and meaningless to the runner -- so MSYS2's gcc never
        # reached PATH, CC=gcc found a different one with no /mingw64/include,
        # and the build failed on a missing openssl/crypto.h.
        MINGW_MSYS="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64"
        MINGW_WIN="$(cygpath -w "${MINGW_MSYS}")"

        echo "${MINGW_WIN}\\bin" >> "$GITHUB_PATH"
        {
          echo "CC=gcc"
          echo "CGO_CFLAGS=-I${SQLCIPHER_DIR}"
          echo "CGO_LDFLAGS=-static -L${MINGW_MSYS}/lib -lws2_32 -lgdi32 -lcrypt32"
          # Consumed by both workflows, so the link mode is decided once.
          echo "WINDOWS_LDFLAGS=-extldflags '-static -Wl,--allow-multiple-definition'"
        } >> "$GITHUB_ENV"

        echo "sqlcipher: ${SQLCIPHER_DIR}"
        echo "mingw:     ${MINGW_WIN}"

    # Proves the toolchain before anything depends on it. The first attempt
    # failed three steps later on a missing header, which read as a toolchain
    # problem rather than a path-format one.
    - name: Verify the toolchain resolves
      shell: bash
      run: |
        set -euo pipefail
        echo "gcc on PATH: $(command -v gcc)"
        gcc -print-search-dirs | head -1
        printf '#include <openssl/crypto.h>\nint main(void){return 0;}\n' > /tmp/probe.c
        gcc ${CGO_CFLAGS} -c /tmp/probe.c -o /tmp/probe.o
        echo "openssl headers resolve"
