name: Windows cgo toolchain
description: >
  Installs MSYS2 and exports the cgo environment the Windows build needs.
  Used by both build.yml and release.yml so the binary a dispatch produces is
  the binary a tag produces.

runs:
  using: composite
  steps:
    - name: Install MSYS2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: MINGW64
        update: true
        # No mingw-w64-x86_64-sqlite3 on purpose. The Windows build compiles
        # the sqlite that go-sqlcipher vendors, via CGO_CFLAGS below, and links
        # it statically. Installing the MSYS2 sqlite as well gave build.yml a
        # dynamically linked binary against a different sqlite from the one
        # that ships — the divergence this action exists to end.
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

    - name: Export cgo environment
      shell: bash
      run: |
        set -euo pipefail

        # Asked of the module graph, never spelled out. A hardcoded copy of this
        # path carrying the pinned pseudo-version is what broke the v0.3.9
        # release: go.mod's replace directive moved and the copy did not.
        SQLCIPHER_DIR="$(go list -m -f '{{.Dir}}' github.com/mutecomm/go-sqlcipher/v4)"
        if [ ! -f "${SQLCIPHER_DIR}/sqlite3.h" ]; then
          echo "::error::sqlite3.h not found under ${SQLCIPHER_DIR}"
          exit 1
        fi

        MINGW="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64"
        echo "${MINGW}/bin" >> "$GITHUB_PATH"
        {
          echo "CC=gcc"
          echo "CGO_CFLAGS=-I${SQLCIPHER_DIR}"
          echo "CGO_LDFLAGS=-static -L${MINGW}/lib -lws2_32 -lgdi32 -lcrypt32"
          # Consumed by both workflows' build steps, so the link mode is decided
          # here rather than in two places that can disagree.
          echo "WINDOWS_LDFLAGS=-extldflags '-static -Wl,--allow-multiple-definition'"
        } >> "$GITHUB_ENV"
