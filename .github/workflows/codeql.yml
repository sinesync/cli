name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed against a dependency after a quiet
    # period is still found without waiting for the next push.
    - cron: '32 4 * * 1'

permissions:
  contents: read

# Declared here rather than inline, so this workflow moves with the other three
# when the toolchain does. It was pinned inline and had already drifted behind.
env:
  GO_VERSION: '1.26'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # CodeQL's Go extractor builds the code, and this build needs cgo:
      # sqlite-vec and go-sqlcipher both link against it. Without this the
      # analysis fails at the build rather than reporting no findings, which is
      # the worse outcome because it looks like a broken workflow rather than
      # missing coverage.
      - name: Install cgo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:go
