name: Build Binaries

on:
  workflow_dispatch:

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  BINARY_NAME: sinesync

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Remove third-party sources that don't support arm64
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
            # Add arm64 sources from ports.ubuntu.com
            CODENAME=$(lsb_release -cs)
            cat <<SOURCES | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME} main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME}-updates main restricted universe
          SOURCES
            # Pin existing Ubuntu sources to amd64 only
            for f in /etc/apt/sources.list.d/ubuntu*.sources; do
              [ -f "$f" ] && sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' "$f"
            done
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev:arm64
          fi

      - name: Install Windows toolchain
        if: matrix.os == 'windows'
        uses: ./.github/actions/windows-cgo

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          LDFLAGS="-s -w -X main.ver=${VERSION} -X main.commit=${COMMIT}"

          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            export CGO_LDFLAGS="-L/usr/lib/aarch64-linux-gnu"
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            # Identical to release.yml's, via the same composite action. This
            # used to install the MSYS2 sqlite and link dynamically against it,
            # while the release compiled go-sqlcipher's vendored sqlite and
            # linked statically — so a green run here said nothing about whether
            # a tag would build, which is how v0.3.9 reached a tag broken.
            go build -ldflags "${LDFLAGS} ${WINDOWS_LDFLAGS}" -o ${{ env.BINARY_NAME }}.exe ./cmd/sinesync
          else
            go build -ldflags "${LDFLAGS}" -o ${{ env.BINARY_NAME }} ./cmd/sinesync
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.BINARY_NAME }}
            ${{ env.BINARY_NAME }}.exe
