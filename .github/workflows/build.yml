name: Build Binaries

on:
  workflow_dispatch:

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  BINARY_NAME: sinesync

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Remove third-party sources that don't support arm64
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
            # Add arm64 sources from ports.ubuntu.com
            CODENAME=$(lsb_release -cs)
            cat <<SOURCES | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME} main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME}-updates main restricted universe
          SOURCES
            # Pin existing Ubuntu sources to amd64 only
            for f in /etc/apt/sources.list.d/ubuntu*.sources; do
              [ -f "$f" ] && sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' "$f"
            done
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev:arm64
          fi

      - name: Install Windows toolchain
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl mingw-w64-x86_64-sqlite3

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          LDFLAGS="-s -w -X main.ver=${VERSION} -X main.commit=${COMMIT}"

          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            export CGO_LDFLAGS="-L/usr/lib/aarch64-linux-gnu"
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            export PATH="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64/bin:$PATH"
            export CC=gcc
            go build -ldflags "${LDFLAGS}" -o ${{ env.BINARY_NAME }}.exe ./cmd/sinesync
          else
            go build -ldflags "${LDFLAGS}" -o ${{ env.BINARY_NAME }} ./cmd/sinesync
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.BINARY_NAME }}
            ${{ env.BINARY_NAME }}.exe
