name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

env:
  GO_VERSION: '1.25'
  BINARY_NAME: sinesync

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Reject anything that is not a strict release version. This value
          # becomes a path prefix (upload/<v>/, gs://bucket/<v>/), the `latest`
          # pointer, and the name under which signed checksums are published, so
          # a malformed value corrupts the release even without code execution.
          # It also blocks newline-bearing inputs from injecting extra lines
          # into $GITHUB_OUTPUT / $GITHUB_ENV. [.] keeps the dots literal (an
          # unquoted \. in [[ =~ ]] loses its backslash and matches any char).
          version_re='^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::Invalid release version '${VERSION}' — expected vMAJOR.MINOR.PATCH or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Ubuntu 24.04+ uses DEB822 format in /etc/apt/sources.list.d/ubuntu.sources
            # Pin existing sources to amd64 only
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
            # Also handle traditional sources.list if present
            sudo sed -i 's/^deb \(http\)/deb [arch=amd64] \1/' /etc/apt/sources.list 2>/dev/null || true
            # Add arm64 sources from ports.ubuntu.com (the only mirror serving arm64)
            CODENAME=$(lsb_release -cs)
            echo "deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME} main restricted universe" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME}-updates main restricted universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ ${CODENAME}-security main restricted universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64
          else
            sudo apt-get update
            sudo apt-get install -y libssl-dev
          fi

      - name: Install Windows cross-compilation tools
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.ver=${VERSION} -X main.commit=${COMMIT}"

          # Set cross-compiler for Linux ARM64
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi

          # Set compiler for Windows (MSYS2 MinGW-w64) — statically link everything
          if [ "${{ matrix.os }}" = "windows" ]; then
            export PATH="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64/bin:$PATH"
            export CC=gcc
            SQLCIPHER_DIR="$(go env GOMODCACHE)/github.com/miclip/go-sqlcipher/v4@v4.4.3-0.20260209183651-988da792235a"
            export CGO_CFLAGS="-I${SQLCIPHER_DIR}"
            export CGO_LDFLAGS="-static -L${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64/lib -lws2_32 -lgdi32 -lcrypt32"
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -ldflags "${LDFLAGS} -extldflags '-static -Wl,--allow-multiple-definition'" -o ${{ env.BINARY_NAME }}.exe ./cmd/sinesync
          else
            go build -ldflags "${LDFLAGS}" -o ${{ env.BINARY_NAME }} ./cmd/sinesync
          fi

      # macOS code signing
      - name: Import macOS signing certificate
        if: matrix.os == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KEYCHAIN_PWD="${KEYCHAIN_PWD:-build-$(date +%s)}"

            # Create keychain
            security create-keychain -p "$KEYCHAIN_PWD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
            security set-keychain-settings -lut 3600 build.keychain

            # Import certificate — use printf to avoid echo mangling base64
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
            security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

            rm certificate.p12
          fi

      - name: Sign macOS binary
        if: matrix.os == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --entitlements entitlements.plist --sign "$MACOS_SIGNING_IDENTITY" ${{ env.BINARY_NAME }}
            codesign --verify --verbose ${{ env.BINARY_NAME }}
            echo "Binary signed successfully"
          else
            echo "Skipping signing - no certificate configured"
          fi

      - name: Notarize macOS binary
        if: matrix.os == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            # Create ZIP for notarization
            zip -r sinesync-notarize.zip ${{ env.BINARY_NAME }}

            # Submit for notarization
            xcrun notarytool submit sinesync-notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PWD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 10m || {
              echo "::warning::Notarization failed or timed out — binary is signed but not notarized"
              rm -f sinesync-notarize.zip
              exit 0
            }

            rm sinesync-notarize.zip
            echo "Binary notarized successfully"
          else
            echo "Skipping notarization - credentials not configured"
          fi

      # Windows code signing via sign CLI (bypasses dlib which has 403 bug)
      - name: Sign Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          dotnet tool install --global sign --version 0.9.1-beta.25330.2
          sign code trusted-signing `
            --trusted-signing-endpoint "https://cus.codesigning.azure.net/" `
            --trusted-signing-account "sinesync" `
            --trusted-signing-certificate-profile "sinesync-code-signing" `
            --file-digest SHA256 `
            --timestamp-url "http://timestamp.acs.microsoft.com" `
            -v Debug `
            "${{ github.workspace }}\${{ env.BINARY_NAME }}.exe"

      - name: Create archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE_NAME="${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"

          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "${ARCHIVE_NAME}.zip" ${{ env.BINARY_NAME }}.exe
            echo "archive=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" ${{ env.BINARY_NAME }}
            echo "archive=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # See the build job's Get version step for why this is validated.
          version_re='^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::Invalid release version '${VERSION}' — expected vMAJOR.MINOR.PATCH or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: GPG sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor artifacts/checksums.txt
            echo "Checksums signed successfully"
          else
            echo "Skipping GPG signing - no key configured"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
            artifacts/checksums.txt.asc
            sinesync-release.pub

  publish-gcs:
    name: Publish to GCS
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      BUCKET: sinesync-releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed by the Ed25519 signing step below. Pinned rather than relying
      # on whatever Go the runner ships, so a toolchain mismatch cannot turn
      # into a release published without the signature clients require.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # See the build job's Get version step for why this is validated.
          version_re='^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::Invalid release version '${VERSION}' — expected vMAJOR.MINOR.PATCH or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "upload/${VERSION}"

          # Move archives into version directory
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} "upload/${VERSION}/" \;

          # Generate checksums
          cd "upload/${VERSION}"
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          cd ../..

          # Copy public key to version dir and bucket root
          if [ -f sinesync-release.pub ]; then
            cp sinesync-release.pub "upload/${VERSION}/"
            cp sinesync-release.pub upload/
          fi

      - name: GPG sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "upload/${VERSION}/checksums.txt"
            echo "Checksums signed"
          else
            echo "Skipping GPG signing — no key configured"
          fi

      # checksums.txt.asc above is the OpenPGP signature humans can check with
      # gpg. This is the one `sinesync update` requires: a raw Ed25519 signature
      # it verifies with crypto/ed25519, which has nothing subtle to get wrong.
      #
      # Deliberately NOT conditional on the secret being present. A release
      # published without checksums.txt.sig is one that no verifying client can
      # install, so a missing key must fail the release rather than quietly
      # produce an unusable one — the mistake would otherwise only surface on
      # user machines.
      - name: Ed25519 sign checksums
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/signrelease \
            --expect-pubkey "$(tr -d '\n' < sinesync-release-ed25519.pub)" \
            "upload/${VERSION}/checksums.txt" \
            > "upload/${VERSION}/checksums.txt.sig"
          echo "Ed25519 signature written:"
          cat "upload/${VERSION}/checksums.txt.sig"

      - name: Upload to GCS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upload version directory (no-clobber to prevent overwriting existing releases)
          gsutil -m cp -r -n "upload/${VERSION}" "gs://${BUCKET}/"

          # Upload public key to bucket root (overwrite)
          if [ -f upload/sinesync-release.pub ]; then
            gsutil cp upload/sinesync-release.pub "gs://${BUCKET}/sinesync-release.pub"
          fi

          # Write latest version pointer (always overwrite, short cache)
          echo -n "${VERSION}" > latest
          gsutil -h "Cache-Control:public, max-age=300" cp latest "gs://${BUCKET}/latest"

          echo "Published ${VERSION} to gs://${BUCKET}/"
          gsutil ls "gs://${BUCKET}/${VERSION}/"
