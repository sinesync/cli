name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default, matching build.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The suite needs cgo: sqlite-vec and go-sqlcipher both build against it.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Until now nothing ran these on a push or a pull request: build.yml is
      # workflow_dispatch only and release.yml fires on tags, so the suite ran
      # only where someone happened to run it. This is the repo that cuts the
      # releases users install.
      - name: Test
        run: go test ./...
