name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default, matching build.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The suite needs cgo: sqlite-vec and go-sqlcipher both build against it.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Until now nothing ran these on a push or a pull request: build.yml is
      # workflow_dispatch only and release.yml fires on tags, so the suite ran
      # only where someone happened to run it. This is the repo that cuts the
      # releases users install.
      - name: Test
        run: go test ./...

  # #11: ubuntu never compiles the _windows.go files, so openLogFileNoFollow --
  # which reconstructs O_NOFOLLOW out of FILE_FLAG_OPEN_REPARSE_POINT because
  # Windows has no equivalent flag -- was written, reviewed and shipped without
  # its refusal ever being observed working. Its four tests had never run
  # anywhere.
  #
  # Cross-compiling does not reach it: internal/daemon pulls in sqlite-vec and
  # go-sqlcipher, so a Windows build needs cgo and a Windows toolchain. Hence a
  # real windows-latest runner with the MSYS2 setup build.yml already uses.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Windows toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl mingw-w64-x86_64-sqlite3

      # Run the reparse point tests on their own first, verbosely. They are the
      # reason this job exists, and both of them skip rather than fail when the
      # runner cannot create the link they need -- a silent skip would leave the
      # refusal exactly as unobserved as before, while the job went green.
      - name: Test the reparse point refusal
        shell: bash
        env:
          CGO_ENABLED: 1
          CC: gcc
        run: |
          export PATH="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64/bin:$PATH"
          go test -v -run OpenLogFileNoFollow ./internal/daemon/ 2>&1 | tee reparse.log

          if ! grep -q -- '--- PASS: TestOpenLogFileNoFollowRefusesASymlink' reparse.log \
             && ! grep -q -- '--- PASS: TestOpenLogFileNoFollowRefusesAJunction' reparse.log; then
            echo "::error::Neither refusal test ran -- both skipped for want of a privilege." \
                 "This job would be proving nothing."
            exit 1
          fi

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: 1
          CC: gcc
        run: |
          export PATH="${MSYS2_ROOT:-/d/a/_temp/msys64}/mingw64/bin:$PATH"
          go test ./...

  # The two jobs above pin GO_VERSION by hand, so go.mod's go directive and the
  # toolchain CI runs on can drift apart without anything noticing: Go's
  # default GOTOOLCHAIN=auto would quietly download whichever version go.mod
  # asks for and build with that instead. This job takes the version from
  # go.mod itself, forbids the switch, and checks the running toolchain is the
  # one go.mod names before building anything.
  build-gomod:
    name: Build (go.mod toolchain)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go build ./... reaches the cgo packages (sqlite-vec, go-sqlcipher), so
      # it needs the same headers the Test job installs.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Assert the toolchain matches go.mod
        run: |
          want="go$(awk '$1 == "go" { print $2 }' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod directive: $want"
          echo "running:          $have (GOTOOLCHAIN=$(go env GOTOOLCHAIN))"
          go version
          if [ "$have" != "$want" ]; then
            echo "::error::running $have but go.mod requires exactly $want"
            exit 1
          fi

      - name: Build
        run: go build ./...
