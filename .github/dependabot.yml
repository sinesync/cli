version: 2

updates:
  # Go is the whole of this repo; there is no package.json here. The npm
  # ecosystem would be configured and silently match nothing.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Go binding and the ONNX Runtime that embeddings.go downloads are a
    # matched pair: the binding requests the ORT_API_VERSION of the header it
    # ships, and a runtime older than that returns no API table, so embedding
    # fails on every platform. A grouped bump once moved the binding alone.
    # Upgrade both by hand, together — the binding in go.mod and onnxVersion
    # with its pinned archive digests — and let
    # TestBindingAPIMatchesDownloadedRuntime confirm they agree.
    ignore:
      - dependency-name: github.com/yalue/onnxruntime_go
    groups:
      # Related modules move in one PR. Six separate golang.org/x bumps is how
      # dependency PRs become something nobody reads.
      golang-x:
        patterns:
          - golang.org/x/*
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - golang.org/x/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    # This repo signs the binaries users install, so the SHA pin is the
    # security property. Dependabot rewrites the pin and the version comment
    # together, which is what makes accepting one of these safe to do quickly.
